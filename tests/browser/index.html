<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="./default.css"><style>
  .trigger { display: inline-block; padding: 6px 12px; border: 1px solid #888; }
  .trigger:has(:focus-visible) { outline: 3px solid rgb(0, 90, 200); }
  .drop { padding: 24px; border: 2px dashed #888; }
  .drop[data-dragging] { border-color: rgb(0, 128, 0); }
  .float { position: relative; display: flex; flex-direction: column; width: 240px; margin-top: 24px; }
  .float-control { order: 1; }
  .float-message { order: 3; margin: 4px 0 0; }
  .float-hint { order: 2; margin: 4px 0 0; font-size: 12px; }
  .float-input { width: 100%; box-sizing: border-box; padding: 22px 12px 6px; font-size: 16px; border: 1px solid #888; }
  .float-input::placeholder { color: transparent; }
  .float-input[data-focused]::placeholder { color: #888; }
  .float-label { position: absolute; z-index: 1; left: 13px; top: 15px; font-size: 16px; pointer-events: none; }
  .float-label[data-filled], .float-label[data-focused] { top: 4px; font-size: 11px; }
</style></head>
<body><div id="root"></div><div id="default-root"></div><script type="module" src="./harness.js"></script></body></html>
